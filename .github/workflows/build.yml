name: Build Rift Dimension Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build the mod
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon --stacktrace
          else
            echo "Gradle Wrapper not found. Trying to install gradle..."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 7.5.1
            ./gradlew build --no-daemon --stacktrace
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RiftDimension-Mod
          path: |
            build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30
